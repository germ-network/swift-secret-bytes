name: Apple

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'CODE_OF_CONDUCT.md'
      - '.editorconfig'
      - '.spi.yml'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test MacOS
    # xcode-27 is the macOS 26 preview image whose default Xcode is the 27
    # beta — needed for the span-gated CryptoKit adoption to compile. The
    # iOS 27 simulator legs also execute the gated paths at runtime.
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      matrix:
        destination:
          - "platform=macOS"
          - "platform=macOS,variant=Mac Catalyst"
          - "platform=iOS Simulator,name=iPhone 17e"
          - "platform=iOS Simulator,name=iPhone Air"
    steps:
      - uses: actions/checkout@v5
      - name: Test platform ${{ matrix.destination }}
        run: set -o pipefail && xcodebuild -skipMacroValidation -scheme SecretBytes -destination "${{ matrix.destination }}" test | xcbeautify
