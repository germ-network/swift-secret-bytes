name: Linux

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "CODE_OF_CONDUCT.md"
      - ".editorconfig"
      - ".spi.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  linux_test:
    name: Test Linux
    runs-on: ubuntu-latest
    container:
      image: swift:${{matrix.swift-version}}
    timeout-minutes: 30
    strategy:
      matrix:
        swift-version:
          - "6.2"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: swift --version
      - name: Test
        run: swift test
      # Release is the configuration that ships, and it is the one where the
      # encoder's `#if DEBUG` self-validation is absent — so every guard has
      # to stand on its own there. Until this step existed the suite could not
      # even be compiled under `-c release`, so nothing checked that.
      # `-enable-testing` is required because `@testable import` needs
      # testability, which release builds do not enable by default.
      - name: Test (release)
        run: swift test -c release -Xswiftc -enable-testing
